<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Leer un mensaje de error en tres pasos</title>
  <desc id="descripcion">Un mensaje de error se lee en este orden: primera la última línea que describe el problema, después el número de línea y por último el símbolo señalado. Luego se corrige una sola cosa y se vuelve a ejecutar.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5L0 10Z" fill="#0f5c8c" />
    </marker>
  </defs>
  <rect width="640" height="340" rx="18" fill="#f6f8fb" />
  <text x="32" y="44" fill="#17212b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Tres pasos para leer un error</text>

  <g font-family="system-ui, sans-serif">
    <rect x="32" y="72" width="176" height="112" rx="10" fill="#e6f1f8" stroke="#0f5c8c" />
    <text x="120" y="102" text-anchor="middle" fill="#0f5c8c" font-size="16" font-weight="700">1. Última línea</text>
    <text x="120" y="130" text-anchor="middle" fill="#475569" font-size="13">Qué regla se incumplió</text>
    <text x="120" y="154" text-anchor="middle" fill="#475569" font-size="12">SyntaxError...</text>

    <rect x="232" y="72" width="176" height="112" rx="10" fill="#e2f3f0" stroke="#0f766e" />
    <text x="320" y="102" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">2. Número de línea</text>
    <text x="320" y="130" text-anchor="middle" fill="#475569" font-size="13">Dónde mirar</text>
    <text x="320" y="154" text-anchor="middle" fill="#475569" font-size="12">line 1</text>

    <rect x="432" y="72" width="176" height="112" rx="10" fill="#f0e9fc" stroke="#6d28d9" />
    <text x="520" y="102" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="700">3. Punto señalado</text>
    <text x="520" y="130" text-anchor="middle" fill="#475569" font-size="13">Posición aproximada</text>
    <text x="520" y="154" text-anchor="middle" fill="#475569" font-size="12">^</text>

    <path d="M208 128h20" stroke="#0f5c8c" stroke-width="2" fill="none" marker-end="url(#flecha)" />
    <path d="M408 128h20" stroke="#0f5c8c" stroke-width="2" fill="none" marker-end="url(#flecha)" />

    <rect x="32" y="216" width="576" height="84" rx="10" fill="#fdf3d8" stroke="#a16207" />
    <text x="320" y="248" text-anchor="middle" fill="#854d0e" font-size="16" font-weight="700">Corregir una sola cosa y volver a ejecutar</text>
    <text x="320" y="278" text-anchor="middle" fill="#475569" font-size="13">La ruta del archivo es contexto; no suele ser la causa.</text>
  </g>
</svg>
