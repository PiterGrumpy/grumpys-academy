<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Rutas relativas desde una subcarpeta</title>
  <desc id="descripcion">Árbol de carpetas: dentro de python-curso está hola.py y la carpeta datos. Al entrar en datos con cd datos, el directorio actual es datos; para ejecutar el script de la carpeta superior se usa python ../hola.py.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5L0 10Z" fill="#0f5c8c" />
    </marker>
  </defs>
  <rect width="640" height="340" rx="18" fill="#f6f8fb" />
  <text x="32" y="44" fill="#17212b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">La ruta depende del directorio actual</text>

  <g font-family="system-ui, sans-serif">
    <rect x="32" y="72" width="256" height="210" rx="12" fill="#ffffff" stroke="#d9e0e8" />
    <text x="52" y="102" fill="#475569" font-size="14" font-weight="700">python-curso/</text>
    <rect x="52" y="120" width="24" height="20" rx="4" fill="#e6f1f8" stroke="#0f5c8c" />
    <text x="86" y="136" fill="#17212b" font-size="14">hola.py</text>
    <rect x="52" y="158" width="24" height="20" rx="4" fill="#e2f3f0" stroke="#0f766e" />
    <text x="86" y="174" fill="#17212b" font-size="14">datos/</text>
    <rect x="72" y="196" width="24" height="20" rx="4" fill="#f0e9fc" stroke="#6d28d9" />
    <text x="106" y="212" fill="#17212b" font-size="14">mediciones.csv</text>

    <rect x="324" y="72" width="284" height="78" rx="10" fill="#e2f3f0" stroke="#0f766e" />
    <text x="344" y="100" fill="#0f766e" font-size="15" font-weight="700">cd datos</text>
    <text x="344" y="126" fill="#475569" font-size="13">Directorio actual: python-curso/datos</text>

    <rect x="324" y="170" width="284" height="112" rx="10" fill="#fdf3d8" stroke="#a16207" />
    <text x="344" y="198" fill="#854d0e" font-size="15" font-weight="700">python ../hola.py</text>
    <text x="344" y="224" fill="#475569" font-size="13"><tspan font-family="monospace">..</tspan> = carpeta superior</text>
    <text x="344" y="250" fill="#475569" font-size="13">Desde datos/, el script está arriba.</text>

    <path d="M288 176h32" stroke="#0f5c8c" stroke-width="2" fill="none" marker-end="url(#flecha)" />
  </g>
</svg>
