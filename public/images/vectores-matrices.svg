<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Vector frente a matriz</title>
  <desc id="descripcion">Un vector es una fila de cuatro celdas con números; una matriz organiza doce números en tres filas y cuatro columnas.</desc>
  <rect width="640" height="360" rx="18" fill="#f6f8fb" />
  <text x="32" y="48" fill="#17212b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Dos formas de agrupar valores</text>

  <rect x="32" y="72" width="272" height="248" rx="12" fill="#ffffff" stroke="#d9e0e8" />
  <path d="M32 84a12 12 0 0 1 12-12h248a12 12 0 0 1 12 12v32H32Z" fill="#e2f3f0" />
  <text x="48" y="101" fill="#0f766e" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Vector</text>
  <text x="48" y="142" fill="#475569" font-family="system-ui, sans-serif" font-size="13">Una fila, un solo tipo de dato</text>

  <rect x="52" y="164" width="44" height="44" rx="6" fill="#e2f3f0" stroke="#0f766e" />
  <rect x="116" y="164" width="44" height="44" rx="6" fill="#e2f3f0" stroke="#0f766e" />
  <rect x="180" y="164" width="44" height="44" rx="6" fill="#e2f3f0" stroke="#0f766e" />
  <rect x="244" y="164" width="44" height="44" rx="6" fill="#e2f3f0" stroke="#0f766e" />
  <g fill="#0f5c8c" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="74" y="192">4</text>
    <text x="138" y="192">10</text>
    <text x="202" y="192">5</text>
    <text x="266" y="192">3</text>
  </g>
  <text x="48" y="246" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="13">c(4, 10, 5, 3)</text>
  <text x="48" y="272" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="13">length() = 4</text>

  <rect x="336" y="72" width="272" height="248" rx="12" fill="#ffffff" stroke="#d9e0e8" />
  <path d="M336 84a12 12 0 0 1 12-12h248a12 12 0 0 1 12 12v32H336Z" fill="#f0e9fc" />
  <text x="352" y="101" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Matriz</text>
  <text x="352" y="142" fill="#475569" font-family="system-ui, sans-serif" font-size="13">Filas y columnas del mismo tipo</text>

  <g fill="#f0e9fc" stroke="#6d28d9">
    <rect x="352" y="160" width="48" height="36" rx="5" /><rect x="412" y="160" width="48" height="36" rx="5" /><rect x="472" y="160" width="48" height="36" rx="5" /><rect x="532" y="160" width="48" height="36" rx="5" />
    <rect x="352" y="204" width="48" height="36" rx="5" /><rect x="412" y="204" width="48" height="36" rx="5" /><rect x="472" y="204" width="48" height="36" rx="5" /><rect x="532" y="204" width="48" height="36" rx="5" />
    <rect x="352" y="248" width="48" height="36" rx="5" /><rect x="412" y="248" width="48" height="36" rx="5" /><rect x="472" y="248" width="48" height="36" rx="5" /><rect x="532" y="248" width="48" height="36" rx="5" />
  </g>
  <g fill="#5b21b6" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <text x="376" y="183">1</text><text x="436" y="183">2</text><text x="496" y="183">3</text><text x="556" y="183">4</text>
    <text x="376" y="227">5</text><text x="436" y="227">6</text><text x="496" y="227">7</text><text x="556" y="227">8</text>
    <text x="376" y="271">9</text><text x="436" y="271">10</text><text x="496" y="271">11</text><text x="556" y="271">12</text>
  </g>
  <text x="352" y="307" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="12">matrix(1:12, nrow = 3)</text>
</svg>
