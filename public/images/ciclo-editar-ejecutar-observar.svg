<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Ciclo editar, ejecutar y observar</title>
  <desc id="descripcion">Esquema con tres pasos: editar el código, ejecutarlo y observar el resultado. Si la salida no coincide con lo esperado, se vuelve a editar con una idea más precisa.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5L0 10Z" fill="#0f5c8c" />
    </marker>
  </defs>
  <rect width="640" height="340" rx="18" fill="#f6f8fb" />
  <text x="32" y="44" fill="#17212b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Un ciclo corto, repetido muchas veces</text>

  <g font-family="system-ui, sans-serif">
    <rect x="32" y="76" width="160" height="68" rx="10" fill="#e6f1f8" stroke="#0f5c8c" />
    <text x="112" y="105" text-anchor="middle" fill="#0f5c8c" font-size="17" font-weight="700">1. Editar</text>
    <text x="112" y="128" text-anchor="middle" fill="#475569" font-size="13">Escribir o cambiar código</text>

    <rect x="240" y="76" width="160" height="68" rx="10" fill="#e2f3f0" stroke="#0f766e" />
    <text x="320" y="105" text-anchor="middle" fill="#0f766e" font-size="17" font-weight="700">2. Ejecutar</text>
    <text x="320" y="128" text-anchor="middle" fill="#475569" font-size="13">Pedir al intérprete que lo lea</text>

    <rect x="448" y="76" width="160" height="68" rx="10" fill="#f0e9fc" stroke="#6d28d9" />
    <text x="528" y="105" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="700">3. Observar</text>
    <text x="528" y="128" text-anchor="middle" fill="#475569" font-size="13">Comparar con lo esperado</text>

    <path d="M192 110h44" stroke="#0f5c8c" stroke-width="2" fill="none" marker-end="url(#flecha)" />
    <path d="M400 110h44" stroke="#0f5c8c" stroke-width="2" fill="none" marker-end="url(#flecha)" />

    <path d="M528 144v42H112v-42" stroke="#a16207" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#flecha)" />
    <rect x="252" y="170" width="236" height="32" rx="8" fill="#fdf3d8" />
    <text x="370" y="191" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="700">Si no coincide, vuelve a editar</text>

    <text x="32" y="252" fill="#475569" font-size="14">Cada vuelta aporta una idea más precisa: el error informa de qué suponíamos mal.</text>
    <text x="32" y="284" fill="#475569" font-size="14">No hace falta memorizar: se aprende probando, leyendo y ajustando.</text>
  </g>
</svg>
